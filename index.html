<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; padding: 15px 10px; background: #121212; color: #e0e0e0; }
        .container { max-width: 1250px; margin: auto; background: #1e1e1e; padding: 15px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2, h3, h4, h5 { text-align: center; color: #ffffff; margin-top: 0; font-size: 20px; }
        .summary-box { background: #332b00; color: #ffda6a; padding: 12px; border-radius: 6px; margin-bottom: 15px; font-size: 16px; font-weight: bold; border: 1px solid #665200; text-align: center; }
        .nav { margin-bottom: 15px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .btn { padding: 8px 12px; border-radius: 4px; border: none; background: #0d6efd; color: white; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; font-size: 13px; }
        .btn-danger { background: #dc3545; }
        .btn-success { background: #198754; }
        .btn-secondary { background: #6c757d; }
        .btn-ai { background: #6f42c1; color: white; font-weight: bold; }
        .nav .right { margin-left: auto; }
        
        .search-box { position: relative; display: flex; align-items: center; }
        .search-input { padding: 7px 10px; border: 1px solid #444; background: #121212; color: #fff; border-radius: 4px; font-size: 13px; width: 180px; }
        .search-input:focus { border-color: #0d6efd; outline: none; }

        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; background: #1e1e1e; min-width: 100%; }
        th, td { border: 1px solid #333333; padding: 12px 8px; text-align: center; font-size: 13px; }
        th { background: #2a2a2a; color: #ffffff; white-space: nowrap; }
        
        tbody tr.clickable-row { cursor: pointer; transition: background 0.2s; }
        tbody tr.clickable-row:hover { background: #282828; }

        .status-paid { color: #2ea043; font-weight: bold; display: inline-block; margin-top: 3px; font-size: 12px; }
        .status-unpaid { color: #f85149; font-weight: bold; display: inline-block; margin-top: 3px; font-size: 12px; }
        .profit-pos { color: #2ea043; font-weight: bold; }
        .profit-neg { color: #f85149; font-weight: bold; }
        .profit-zero { color: #8b949e; font-weight: bold; }
        .form-card { background: #252525; padding: 15px; border-radius: 6px; border: 1px solid #333; margin-bottom: 20px; }
        .form-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .form-group { margin-bottom: 10px; flex: 1; min-width: 140px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 13px; color: #ccc; }
        input[type="text"], input[type="password"], input[type="date"], input[type="file"] { width: 100%; padding: 8px; border: 1px solid #444; background: #121212; color: #fff; border-radius: 4px; font-size: 13px; }
        .hidden { display: none !important; }
        .expr-tag { display: block; color: #58a6ff; font-size: 11px; font-style: italic; margin-bottom: 2px; }
        .code-cell { text-align: center; font-weight: bold; word-break: break-word; color: #ffffff; }
        .date-cell { font-size: 13px; color: #8b949e; font-weight: bold; white-space: nowrap; }
        .item-title { font-weight: bold; color: #ffffff; margin: 2px 0; }
        .code-highlight { background-color: #7d5a00; color: #fff; padding: 1px 4px; border-radius: 3px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 10px; }
        .modal-card { background: #252525; border-radius: 8px; border: 1px solid #444; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); position: relative; }
        .modal-card h3 { border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 15px; }
        .detail-row { margin-bottom: 10px; font-size: 14px; line-height: 1.5; }
        .detail-row strong { color: #58a6ff; }
        .modal-image { width: 100%; max-height: 350px; object-fit: contain; border-radius: 6px; border: 1px solid #444; margin-top: 10px; background: #121212; }
    </style>
</head>
<body>

<div class="container">
    <h2>SỔ SÁCH THEO DÕI BÁN TRÂU BÒ</h2>
    <h3>Quản Lý Sổ Sách - Tích hợp AI OCR</h3>

    <!-- KHU VỰC ADMIN (NHẬP HÓA ĐƠN & AI OCR) -->
    <div id="admin-section" class="form-card hidden">
        <h3 id="form-title">Nhập Hóa Đơn Mới</h3>
        <form id="cattle-form" onsubmit="handleSave(event)">

            <div class="form-row" style="background: #1a1a2e; padding: 10px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #4a3b8c;">
                <div class="form-group" style="margin-bottom:0;">
                    <label style="color: #b39ddb;">Tải ảnh hóa đơn & Dùng AI Quét Tự Động:</label>

            <div class="form-row">
                <div class="form-group">
                    <label>Tên hàng:</label>

                <div class="form-group">

            <div class="form-group">

                <input type="text" id="input-codes" required placeholder="VD: 2562, 2563, 2564...">
            </div>

            <div class="form-row">

                    <input type="text" id="input-import-price" placeholder="VD: 9x0+4+4x2">

                <div class="form-group">

            <div class="form-row">
                <div class="form-group">
                    <label>Ngày nhập (Ngày mua):</label>

                </div>
                <div class="form-group">

            <div class="form-group">
                <label style="cursor: pointer;">
                    <input type="checkbox" id="input-is-paid">

            <div class="form-group">
                <label>Link Ảnh thủ công (nếu không chọn file):</label>

            <button type="submit" class="btn btn-success" id="btn-save">Lưu Hóa Đơn</button>

<!-- POPUP CHI TIẾT KHI BẤM VÀO DÒNG -->

<script>
    const SUPABASE_URL = 'https://ldadlcpwhvqlwqtayxek.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxkYWRsY3B3aHZxbHdxdGF5eGVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNzAzODgsImV4cCI6MjEwMjk0NjM4OH0.6jx324kJvqdcj8s0nQ5IHbi5T8qe3q-lkT44A_sA5FY';

    // ĐIỀN GEMINI API KEY CỦA BẠN VÀO ĐÂY ĐỂ DÙNG TÍNH NĂNG QUÉT AI

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let isAdmin = false;
    let currentFilter = 'all';
    let searchDebounce = null;
    let globalData = [];

    document.getElementById('input-import-date').valueAsDate = new Date();
    document.getElementById('input-export-date').valueAsDate = new Date();

    function formatDateDisplay(dateVal) {
        if (!dateVal) return '--';
        let str = dateVal.toString().substring(0, 10);
        let parts = str.split('-');
        if (parts.length === 3) {
            return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }
        return dateVal;
    }

    function expandCodeRanges(inputStr) {
        if (!inputStr) return [];
        let parts = inputStr.toString().split(/,|\n/);
        let resultCodes = [];

        parts.forEach(part => {
            part = part.trim();
            if (!part) return;

            if (part.includes('-')) {
                let range = part.split('-');
                if (range.length === 2) {
                    let start = parseInt(range[0].trim());
                    let end = parseInt(range[1].trim());
                    if (!isNaN(start) && !isNaN(end) && start <= end) {
                        for (let i = start; i <= end; i++) {
                            resultCodes.push(i);
                        }
                    } else {
                        resultCodes.push(part);
                    }
                } else {
                    resultCodes.push(part);
                }
            } else {
                resultCodes.push(part);
            }
        });

        return resultCodes;
    }

    function calculatePrice(input) {
        if (!input) return 0;
        let expr = input.toString().replace(/,/g, '.').toLowerCase().replace(/x/g, '*').trim();
        try {
            if (!/^[0-9\.\+\-\*\/\(\)\s]+$/.test(expr)) return 0;
            let res = Function(`"use strict"; return (${expr})`)();
            if (isNaN(res) || !isFinite(res)) return 0;
            return (res > 0 && res < 10000) ? res * 1000000 : res;
        } catch (e) {
            return 0;
        }
    }

    function formatPriceDisplay(rawInput, numericPrice) {
        let formattedPrice = (numericPrice || 0).toLocaleString('vi-VN');
        if (!rawInput) return formattedPrice;
        let str = rawInput.toString().trim();
        if (/[x\*\+\-\/]/.test(str)) {
            return `<span class="expr-tag">${str} =</span><strong>${formattedPrice}</strong>`;
        }
        return formattedPrice;
    }

    function compressImage(file, maxWidth = 1200, quality = 0.75) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    canvas.toBlob((blob) => {
                        resolve(new File([blob], file.name.replace(/\.[^/.]+$/, "") + ".jpg", {
                            type: 'image/jpeg'
                        }));
                    }, 'image/jpeg', quality);
                };
            };
        });
    }

    async function uploadImageToSupabase(originalFile) {
        try {
            const compressedFile = await compressImage(originalFile);
            let fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.jpg`;

            let { error: uploadError } = await supabaseClient.storage
                .from('cattle-images')
                .upload(fileName, compressedFile);

            if (uploadError) {
                alert('Lỗi tải ảnh: ' + uploadError.message);
                return null;
            }

            const { data } = supabaseClient.storage.from('cattle-images').getPublicUrl(fileName);
            return data.publicUrl;
        } catch (err) {
            alert('Không nén được ảnh: ' + err.message);
            return null;
        }
    }

    // TÍNH NĂNG ĐỌC ẢNH AI BẰNG GEMINI (LẤY KEY TỪ SUPABASE)
    async function scanImageWithAI() {
    const fileInput = document.getElementById('input-file').files[0];
    if (!fileInput) {
        alert('Vui lòng chọn 1 tệp ảnh hóa đơn trước!');
        return;
    }

    const btnOcr = document.getElementById('btn-ocr');
    btnOcr.disabled = true;
    btnOcr.innerText = '⏳ Đang đọc ảnh với Gemini 2.5...';

    try {
        // 1. Lấy API Key từ Supabase
        const { data: configData, error: configError } = await supabaseClient
            .from('system_config')
            .select('value')
            .eq('key', 'GEMINI_KEY')
            .single();

        if (configError || !configData || !configData.value) {
            alert('Lỗi: Chưa có GEMINI_KEY trong Supabase!');
            btnOcr.disabled = false;
            btnOcr.innerText = '✨ Quét & Điền AI';
            return;
        }

        const apiKey = configData.value.trim();

        // 2. Đọc file ảnh và gửi lên API
        const reader = new FileReader();
        reader.readAsDataURL(fileInput);
        reader.onload = async () => {
            const base64Data = reader.result.split(',')[1];

            const promptText = `Trích xuất thông tin từ hóa đơn này và trả về duy nhất một chuỗi JSON hợp lệ.
Cấu trúc JSON bắt buộc:
{
  "item_name": "Tên hàng hóa (ví dụ: Bò)",
  "weight_expr": "Trọng lượng hoặc biểu thức (ví dụ: 9x11.6)",
  "code": "Danh sách các mã số MTT phân cách bằng dấu phẩy",
  "selling_price": "Thành tiền/Tổng tiền (ví dụ: 104.400)",
  "date": "Ngày xuất dạng YYYY-MM-DD"
}`;

            // Sử dụng mô hình gemini-2.5-flash chuẩn mới nhất
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: promptText },
                            { inline_data: { mime_type: fileInput.type || "image/jpeg", data: base64Data } }
                        ]
                    }],
                    generationConfig: {
                        response_mime_type: "application/json"
                    }
                })
            });

            const data = await response.json();
            btnOcr.disabled = false;
            btnOcr.innerText = '✨ Quét & Điền AI';

            if (data.candidates && data.candidates[0] && data.candidates[0].content) {
                let rawText = data.candidates[0].content.parts[0].text;
                let result = JSON.parse(rawText);

                if (result.item_name) document.getElementById('input-item-name').value = result.item_name;
                if (result.weight_expr) document.getElementById('input-weight').value = result.weight_expr;
                if (result.code) document.getElementById('input-codes').value = result.code;
                if (result.selling_price) document.getElementById('input-selling-price').value = result.selling_price;
                if (result.date) {
                    document.getElementById('input-import-date').value = result.date;
                    document.getElementById('input-export-date').value = result.date;
                }

                alert('✨ Đã quét và tự động điền dữ liệu thành công!');
            } else {
                console.log('Chi tiết từ Gemini:', data);
                alert('AI không nhận diện được thông tin. Mở Console (F12) để xem chi tiết.');
            }
        };
    } catch (e) {
        btnOcr.disabled = false;
        btnOcr.innerText = '✨ Quét & Điền AI';
        alert('Lỗi xử lý: ' + e.message);
    }
}
    function toggleAuth() {
        if (isAdmin) {
            isAdmin = false;
            document.getElementById('btn-login-toggle').innerText = 'Admin';
            document.getElementById('admin-section').classList.add('hidden');
            document.querySelectorAll('.admin-col').forEach(el => el.classList.add('hidden'));
        } else {

        }

    async function handleLoginSubmit(e) {

        }
    }

    function onSearchInput() {
        clearTimeout(searchDebounce);
        searchDebounce = setTimeout(() => {
            loadData(currentFilter);
        }, 300);
    }

    async function loadData(filter = 'all') {
        currentFilter = filter;
        let searchCodeQuery = document.getElementById('search-code').value.trim().toLowerCase();

        const { data: allDataForTotal } = await supabaseClient
            .from('cattle')
            .select('selling_price, is_paid');
        
        if (allDataForTotal) {
            let totalUnpaid = allDataForTotal.reduce((sum, item) => !item.is_paid ? sum + (item.selling_price || 0) : sum, 0);
            document.getElementById('total-unpaid').innerText = totalUnpaid.toLocaleString('vi-VN');
        }

        let query = supabaseClient.from('cattle').select('*');
        if (filter === 'unpaid') query = query.eq('is_paid', false);

        const { data, error } = await query;
        if (error) {
            alert('Lỗi CSDL: ' + error.message);
            return;
        }

        let tbody = document.getElementById('table-body');
        tbody.innerHTML = '';

        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6">Chưa có dữ liệu nào.</td></tr>';
            return;
        }

        let filteredData = data;
        if (searchCodeQuery) {
            filteredData = data.filter(item => {
                if (!item.code) return false;
                let codeList = expandCodeRanges(item.code);
                return codeList.some(c => c.toString().toLowerCase().includes(searchCodeQuery));
            });
        }

        if (filteredData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6">Không tìm thấy mã số "${searchCodeQuery}"</td></tr>`;
            return;
        }

        filteredData.sort((a, b) => {
            let dateA = (a.export_date || a.import_date || a.created_at || '1970-01-01').substring(0, 10);
            let dateB = (b.export_date || b.import_date || b.created_at || '1970-01-01').substring(0, 10);

            if (dateA !== dateB) {
                return dateB.localeCompare(dateA);
            }
            return b.id - a.id;
        });

        globalData = filteredData;

        filteredData.forEach((item, index) => {
            let importDisplay = formatPriceDisplay(item.import_price_raw, item.import_price);
            let sellingDisplay = formatPriceDisplay(item.selling_price_raw, item.selling_price);

            let codeList = expandCodeRanges(item.code || '');
            
            let formattedCodes = codeList.map(c => {
                let cStr = c.toString();
                if (searchCodeQuery && cStr.toLowerCase().includes(searchCodeQuery)) {
                    return `<span class="code-highlight">${cStr}</span>`;
                }
                return cStr;
            });

            let displayCode = formattedCodes.join(', ');
            let totalCount = codeList.length;

            let baseName = item.item_name || 'Bò';
            baseName = baseName.replace(/\s*\(\d+\s*con\)/gi, '').trim();

            let displayName = totalCount > 0 ? `${baseName} (${totalCount} con)` : baseName;

            let rawExportDate = item.export_date || item.import_date || item.created_at;
            let displayExportDate = formatDateDisplay(rawExportDate);

            let importVal = item.import_price || 0;
            let sellingVal = item.selling_price || 0;
            let profit = sellingVal - importVal;
            
            let profitClass = 'profit-zero';
            let profitPrefix = '';
            if (profit > 0) {
                profitClass = 'profit-pos';
                profitPrefix = '+';
            } else if (profit < 0) {
                profitClass = 'profit-neg';
            }
            let profitDisplay = `<span class="${profitClass}">${profitPrefix}${profit.toLocaleString('vi-VN')}</span>`;

            let combinedInfoHtml = `
                <div class="date-cell">${displayExportDate}</div>
                <div class="item-title">${displayName}</div>
                <div>
                    <span class="${item.is_paid ? 'status-paid' : 'status-unpaid'}">
                        ${item.is_paid ? '● Đã TT' : '● Chưa TT'}
                    </span>
                </div>
            `;

            let row = `
                <tr class="clickable-row" onclick="openDetailModal(${index})">
                    <td>${combinedInfoHtml}</td>
                    <td class="code-cell">${displayCode || '--'}</td>
                    <td class="admin-col ${isAdmin ? '' : 'hidden'}">${importDisplay}</td>
                    <td class="admin-col ${isAdmin ? '' : 'hidden'}">${sellingDisplay}</td>
                    <td class="admin-col ${isAdmin ? '' : 'hidden'}">${profitDisplay}</td>
                    <td class="admin-col ${isAdmin ? '' : 'hidden'}" onclick="event.stopPropagation()">
                        <button class="btn" style="padding:4px 8px; font-size:12px;" onclick='editItem(${JSON.stringify(item)})'>Sửa</button>
                        <button class="btn btn-danger" style="padding:4px 8px; font-size:12px;" onclick="deleteItem(${item.id})">Xóa</button>
                    </td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
    }

    function openDetailModal(index) {
        let item = globalData[index];
        if (!item) return;

        let codeList = expandCodeRanges(item.code || '');
        let totalCount = codeList.length;
        let baseName = item.item_name || 'Bò';
        baseName = baseName.replace(/\s*\(\d+\s*con\)/gi, '').trim();
        let displayName = totalCount > 0 ? `${baseName} (${totalCount} con)` : baseName;

        let html = `
            <div class="detail-row"><strong>Tên hàng:</strong> ${displayName}</div>
            <div class="detail-row"><strong>Ngày xuất:</strong> ${formatDateDisplay(item.export_date || item.import_date)}</div>
            <div class="detail-row"><strong>Trạng thái:</strong> <span class="${item.is_paid ? 'status-paid' : 'status-unpaid'}">${item.is_paid ? 'Đã thanh toán' : 'Chưa thanh toán'}</span></div>
            <div class="detail-row"><strong>Mã số:</strong> ${item.code || '--'}</div>
            <div class="detail-row"><strong>Ghi chú / Trọng lượng:</strong> ${item.weight_expr || '--'}</div>
        `;

        if (isAdmin) {
            html += `
                <div class="detail-row"><strong>Giá bán (Thành tiền):</strong> ${(item.selling_price || 0).toLocaleString('vi-VN')} VNĐ</div>
                <div class="detail-row"><strong>Giá nhập:</strong> ${(item.import_price || 0).toLocaleString('vi-VN')} VNĐ</div>
                <div class="detail-row"><strong>Lãi/Lỗ:</strong> ${((item.selling_price || 0) - (item.import_price || 0)).toLocaleString('vi-VN')} VNĐ</div>
            `;
        }

        html += `<div style="margin-top: 15px;"><strong>Hình ảnh hóa đơn:</strong></div>`;

        if (item.image_url) {
            html += `<a href="${item.image_url}" target="_blank"><img src="${item.image_url}" class="modal-image" alt="Ảnh hóa đơn"></a>`;
        } else {
            html += `<div style="color: #888; font-style: italic; margin-top: 5px;">(Không có hình ảnh đính kèm)</div>`;
        }

        document.getElementById('detail-content').innerHTML = html;
        document.getElementById('detail-modal').classList.remove('hidden');
    }

    function closeDetailModal(e) {
        if (!e || e.target.id === 'detail-modal' || e.target.tagName === 'BUTTON') {
            document.getElementById('detail-modal').classList.add('hidden');
        }
    }

    async function handleSave(e) {
        e.preventDefault();
        let editId = document.getElementById('edit-id').value;
        let fileInput = document.getElementById('input-file').files[0];
        let imgInput = document.getElementById('input-image-url').value.trim();

        let btnSave = document.getElementById('btn-save');
        btnSave.disabled = true;
        btnSave.innerText = 'Đang xử lý ảnh & lưu...';

        if (fileInput) {
            let uploadedUrl = await uploadImageToSupabase(fileInput);
            if (uploadedUrl) {
                imgInput = uploadedUrl;
            }
        }

        let rawCodeInput = document.getElementById('input-codes').value.trim();
        let expandedCodes = expandCodeRanges(rawCodeInput).join(', ');

        let importDateVal = document.getElementById('input-import-date').value || new Date().toISOString().split('T')[0];
        let exportDateVal = document.getElementById('input-export-date').value || importDateVal;

        let payload = {
            item_name: document.getElementById('input-item-name').value.trim(),
            weight_expr: document.getElementById('input-weight').value.trim(),
            code: expandedCodes,
            import_price_raw: String(document.getElementById('input-import-price').value || '').trim(),
            selling_price_raw: String(document.getElementById('input-selling-price').value || '').trim(),
            import_price: calculatePrice(document.getElementById('input-import-price').value),
            selling_price: calculatePrice(document.getElementById('input-selling-price').value),
            import_date: importDateVal,
            export_date: exportDateVal,
            is_paid: document.getElementById('input-is-paid').checked,
            image_url: imgInput || null
        };

        if (editId) {
            const { error } = await supabaseClient.from('cattle').update(payload).eq('id', editId);
            if (error) { alert('Lỗi: ' + error.message); btnSave.disabled = false; btnSave.innerText = 'Lưu Hóa Đơn'; return; }
        } else {
            const { error } = await supabaseClient.from('cattle').insert([payload]);
            if (error) { alert('Lỗi: ' + error.message); btnSave.disabled = false; btnSave.innerText = 'Lưu Hóa Đơn'; return; }
        }

        alert('Đã lưu thành công!');
        btnSave.disabled = false;
        resetForm();
        loadData(currentFilter);
    }

    function editItem(item) {
        document.getElementById('edit-id').value = item.id;
        
        let cleanName = (item.item_name || '').replace(/\s*\(\d+\s*con\)/gi, '').trim();
        document.getElementById('input-item-name').value = cleanName;
        
        document.getElementById('input-weight').value = item.weight_expr || '';
        document.getElementById('input-codes').value = item.code || '';
        document.getElementById('input-import-price').value = item.import_price_raw || item.import_price || '';
        document.getElementById('input-selling-price').value = item.selling_price_raw || item.selling_price || '';
        document.getElementById('input-import-date').value = item.import_date || '';
        document.getElementById('input-export-date').value = item.export_date || item.import_date || '';
        document.getElementById('input-is-paid').checked = item.is_paid;
        document.getElementById('input-image-url').value = item.image_url || '';
        document.getElementById('input-file').value = '';

        document.getElementById('form-title').innerText = 'Chỉnh Sửa Hóa Đơn';
        document.getElementById('btn-save').innerText = 'Cập Nhật';
        document.getElementById('btn-cancel').classList.remove('hidden');
    }

    function resetForm() {
        document.getElementById('cattle-form').reset();
        document.getElementById('edit-id').value = '';
        document.getElementById('form-title').innerText = 'Nhập Hóa Đơn Mới';
        document.getElementById('btn-save').innerText = 'Lưu Hóa Đơn';
        document.getElementById('btn-cancel').classList.add('hidden');
        document.getElementById('input-import-date').valueAsDate = new Date();
        document.getElementById('input-export-date').valueAsDate = new Date();
        document.getElementById('input-is-paid').checked = false;
    }

    async function deleteItem(id) {
        if (confirm('Bạn chắc chắn muốn xóa?')) {
            await supabaseClient.from('cattle').delete().eq('id', id);
            loadData(currentFilter);
        }
    }

    loadData();
</script>
</body>
</html>
