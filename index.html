<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sổ Sách Quản Lý Trâu Bò</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #121212; color: #e0e0e0; }
        .container { max-width: 1250px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2, h3 { text-align: center; color: #ffffff; margin-top: 0; }
        .summary-box { background: #332b00; color: #ffda6a; padding: 15px; border-radius: 6px; margin-bottom: 20px; font-size: 20px; font-weight: bold; border: 1px solid #665200; text-align: center; }
        .nav { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { padding: 8px 16px; border-radius: 4px; border: none; background: #0d6efd; color: white; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-danger { background: #dc3545; }
        .btn-success { background: #198754; }
        .btn-secondary { background: #6c757d; }
        .nav .right { margin-left: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #1e1e1e; }
        th, td { border: 1px solid #333333; padding: 12px 10px; text-align: center; font-size: 14px; }
        th { background: #2a2a2a; color: #ffffff; }
        .status-paid { color: #2ea043; font-weight: bold; }
        .status-unpaid { color: #f85149; font-weight: bold; }
        .profit-pos { color: #2ea043; font-weight: bold; }
        .profit-neg { color: #f85149; font-weight: bold; }
        .profit-zero { color: #8b949e; font-weight: bold; }
        .form-card { background: #252525; padding: 18px; border-radius: 6px; border: 1px solid #333; margin-bottom: 25px; }
        .form-row { display: flex; gap: 15px; }
        .form-group { margin-bottom: 12px; flex: 1; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; color: #ccc; }
        input[type="text"], input[type="password"], input[type="date"] { width: 100%; padding: 8px; border: 1px solid #444; background: #121212; color: #fff; border-radius: 4px; }
        .hidden { display: none !important; }
        img.thumb { max-width: 60px; height: auto; border-radius: 4px; }
        .expr-tag { display: block; color: #58a6ff; font-size: 12px; font-style: italic; margin-bottom: 2px; }
        .code-cell { text-align: center; font-weight: bold; word-break: break-word; color: #ffffff; }
        .date-cell { font-size: 14px; color: #8b949e; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>SỔ SÁCH THEO DÕI BÁN TRÂU BÒ</h2>

    <div class="summary-box">
        Tổng tiền chưa thanh toán: <span id="total-unpaid">0</span> VNĐ
    </div>

    <div class="nav">
        <button class="btn" onclick="loadData('all')">Xem Tất Cả</button>
        <button class="btn btn-danger" onclick="loadData('unpaid')">Chỉ Chưa Thanh Toán</button>
        <div class="right">
            <button id="btn-login-toggle" class="btn btn-success" onclick="toggleAuth()">Đăng Nhập Admin</button>
        </div>
    </div>

    <!-- POPUP ĐĂNG NHẬP ADMIN -->
    <div id="login-modal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000;">
        <div style="background: #252525; padding: 25px; border-radius: 8px; border: 1px solid #444; width: 320px; box-shadow: 0 5px 15px rgba(0,0,0,0.5);">
            <h3 style="margin-top: 0; text-align: center; color: #fff;">Đăng Nhập Admin</h3>
            <form onsubmit="handleLoginSubmit(event)">
                <div style="margin-bottom: 12px;">
                    <label style="display: block; margin-bottom: 5px; color: #ccc;">Tài khoản:</label>
                    <input type="text" id="modal-username" required placeholder="Nhập tài khoản...">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 5px; color: #ccc;">Mật khẩu:</label>
                    <input type="password" id="modal-password" required placeholder="Nhập mật khẩu...">
                </div>
                <div style="display: flex; gap: 10px; justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="closeLoginModal()">Hủy</button>
                    <button type="submit" class="btn btn-success">Đăng Nhập</button>
                </div>
            </form>
        </div>
    </div>

    <!-- KHU VỰC ADMIN (NHẬP HÓA ĐƠN) -->
    <div id="admin-section" class="form-card hidden">
        <h3 id="form-title">Nhập Hóa Đơn Mới</h3>
        <form id="cattle-form" onsubmit="handleSave(event)">
            <input type="hidden" id="edit-id">
            
            <div class="form-row">
                <div class="form-group">
                    <label>Tên hàng:</label>
                    <input type="text" id="input-item-name" placeholder="VD: Bò">
                </div>
                <div class="form-group">
                    <label>Ghi chú / Trọng lượng:</label>
                    <input type="text" id="input-weight" placeholder="VD: Bò đực đẹp">
                </div>
            </div>

            <div class="form-group">
                <label id="label-codes">Mã Số (Nhập tắt VD: 1-5, 7, 9-12):</label>
                <input type="text" id="input-codes" required placeholder="Gõ: 1-5, 7, 9-12...">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Giá nhập (VNĐ hoặc VD: 9x0+4+4x2):</label>
                    <input type="text" id="input-import-price" placeholder="VD: 9x0+4+4x2">
                </div>
                <div class="form-group">
                    <label>Giá bán (Thành tiền VNĐ):</label>
                    <input type="text" id="input-selling-price" placeholder="VD: 9x0+4+3 hoặc 7000000">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Ngày nhập (Ngày mua):</label>
                    <input type="date" id="input-import-date">
                </div>
                <div class="form-group">
                    <label>Ngày bán (Ngày xuất):</label>
                    <input type="date" id="input-export-date">
                </div>
            </div>

            <div class="form-group">
                <label style="cursor: pointer;">
                    <input type="checkbox" id="input-is-paid" checked> 
                    <span style="color: #2ea043; font-weight: bold;">Đã thanh toán</span>
                </label>
            </div>

            <div class="form-group">
                <label>Link Ảnh hóa đơn:</label>
                <input type="text" id="input-image-url" placeholder="Dán đường dẫn ảnh hóa đơn...">
            </div>

            <button type="submit" class="btn btn-success" id="btn-save">Lưu Hóa Đơn</button>
            <button type="button" class="btn btn-secondary hidden" id="btn-cancel" onclick="resetForm()">Hủy Sửa</button>
        </form>
    </div>

    <!-- BẢNG DỮ LIỆU -->
    <table>
        <thead>
            <tr>
                <th>Ngày Xuất</th>
                <th>Tên Hàng</th>
                <th>Mã Số (MTT)</th>
                <th class="admin-col hidden">Giá Nhập</th>
                <th>Giá Bán (Thành Tiền)</th>
                <th class="admin-col hidden">Lãi / Lỗ</th>
                <th>Trạng Thái</th>
                <th>Hình Ảnh</th>
                <th class="admin-col hidden">Thao Tác</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <tr><td colspan="9">Đang tải dữ liệu...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const SUPABASE_URL = 'https://ldadlcpwhvqlwqtayxek.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxkYWRsY3B3aHZxbHdxdGF5eGVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNzAzODgsImV4cCI6MjEwMjk0NjM4OH0.6jx324kJvqdcj8s0nQ5IHbi5T8qe3q-lkT44A_sA5FY';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let isAdmin = false;
    let currentFilter = 'all';

    document.getElementById('input-import-date').valueAsDate = new Date();
    document.getElementById('input-export-date').valueAsDate = new Date();

    function formatDateDisplay(dateVal) {
        if (!dateVal) return '--';
        let str = dateVal.toString().substring(0, 10);
        let parts = str.split('-');
        if (parts.length === 3) {
            return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }
        return dateVal;
    }

    function expandCodeRanges(inputStr) {
        if (!inputStr) return [];
        let parts = inputStr.toString().split(/,|\n/);
        let resultCodes = [];

        parts.forEach(part => {
            part = part.trim();
            if (!part) return;

            if (part.includes('-')) {
                let range = part.split('-');
                if (range.length === 2) {
                    let start = parseInt(range[0].trim());
                    let end = parseInt(range[1].trim());
                    if (!isNaN(start) && !isNaN(end) && start <= end) {
                        for (let i = start; i <= end; i++) {
                            resultCodes.push(i);
                        }
                    } else {
                        resultCodes.push(part);
                    }
                } else {
                    resultCodes.push(part);
                }
            } else {
                resultCodes.push(part);
            }
        });

        return resultCodes;
    }

    function calculatePrice(input) {
        if (!input) return 0;
        let expr = input.toString().replace(/,/g, '.').toLowerCase().replace(/x/g, '*').trim();
        try {
            if (!/^[0-9\.\+\-\*\/\(\)\s]+$/.test(expr)) return 0;
            let res = Function(`"use strict"; return (${expr})`)();
            if (isNaN(res) || !isFinite(res)) return 0;
            return (res > 0 && res < 10000) ? res * 1000000 : res;
        } catch (e) {
            return 0;
        }
    }

    function formatPriceDisplay(rawInput, numericPrice) {
        let formattedPrice = (numericPrice || 0).toLocaleString('vi-VN');
        if (!rawInput) return formattedPrice;
        let str = rawInput.toString().trim();
        if (/[x\*\+\-\/]/.test(str)) {
            return `<span class="expr-tag">${str} =</span><strong>${formattedPrice}</strong>`;
        }
        return formattedPrice;
    }

    function toggleAuth() {
        if (isAdmin) {
            isAdmin = false;
            document.getElementById('btn-login-toggle').innerText = 'Đăng Nhập Admin';
            document.getElementById('admin-section').classList.add('hidden');
            document.querySelectorAll('.admin-col').forEach(el => el.classList.add('hidden'));
        } else {
            document.getElementById('modal-username').value = '';
            document.getElementById('modal-password').value = '';
            document.getElementById('login-modal').classList.remove('hidden');
        }
    }

    function closeLoginModal() {
        document.getElementById('login-modal').classList.add('hidden');
    }

    async function handleLoginSubmit(e) {
        e.preventDefault();
        let user = document.getElementById('modal-username').value.trim();
        let pass = document.getElementById('modal-password').value.trim();

        const { data, error } = await supabaseClient
            .from('users')
            .select('*')
            .eq('username', user)
            .eq('password', pass)
            .maybeSingle();

        if (error) {
            alert('Lỗi kết nối CSDL: ' + error.message);
            return;
        }

        if (data) {
            isAdmin = true;
            closeLoginModal();
            document.getElementById('btn-login-toggle').innerText = 'Đăng Xuất Admin';
            document.getElementById('admin-section').classList.remove('hidden');
            document.querySelectorAll('.admin-col').forEach(el => el.classList.remove('hidden'));
        } else {
            alert('Tên đăng nhập hoặc mật khẩu không chính xác!');
        }
    }

    async function loadData(filter = 'all') {
        currentFilter = filter;

        const { data: allDataForTotal } = await supabaseClient
            .from('cattle')
            .select('selling_price, is_paid');
        
        if (allDataForTotal) {
            let totalUnpaid = allDataForTotal.reduce((sum, item) => !item.is_paid ? sum + (item.selling_price || 0) : sum, 0);
            document.getElementById('total-unpaid').innerText = totalUnpaid.toLocaleString('vi-VN');
        }

        let query = supabaseClient.from('cattle').select('*');
        if (filter === 'unpaid') query = query.eq('is_paid', false);

        const { data, error } = await query;
        if (error) {
            alert('Lỗi CSDL: ' + error.message);
            return;
        }

        let tbody = document.getElementById('table-body');
        tbody.innerHTML = '';

        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9">Chưa có dữ liệu nào.</td></tr>';
            return;
        }

        // Sắp xếp ngày xuất mới nhất lên đầu
        data.sort((a, b) => {
            let dateA = (a.export_date || a.import_date || a.created_at || '1970-01-01').substring(0, 10);
            let dateB = (b.export_date || b.import_date || b.created_at || '1970-01-01').substring(0, 10);

            if (dateA !== dateB) {
                return dateB.localeCompare(dateA);
            }
            return b.id - a.id;
        });

        data.forEach(item => {
            let importDisplay = formatPriceDisplay(item.import_price_raw, item.import_price);
            let sellingDisplay = formatPriceDisplay(item.selling_price_raw, item.selling_price);

            let codeList = expandCodeRanges(item.code || '');
            let displayCode = codeList.join(', ');
            let totalCount = codeList.length;

            let baseName = item.item_name || 'Bò';
            baseName = baseName.replace(/\s*\(\d+\s*con\)/gi, '').trim();

            let displayName = totalCount > 0 ? `${baseName} (${totalCount} con)` : baseName;

            let rawExportDate = item.export_date || item.import_date || item.created_at;
            let displayExportDate = formatDateDisplay(rawExportDate);

            let importVal = item.import_price || 0;
            let sellingVal = item.selling_price || 0;
            let profit = sellingVal - importVal;
            
            let profitClass = 'profit-zero';
            let profitPrefix = '';
            if (profit > 0) {
                profitClass = 'profit-pos';
                profitPrefix = '+';
            } else if (profit < 0) {
                profitClass = 'profit-neg';
            }
            let profitDisplay = `<span class="${profitClass}">${profitPrefix}${profit.toLocaleString('vi-VN')}</span>`;

            let row = `
                <tr>
                    <td class="date-cell">${displayExportDate}</td>
                    <td><strong>${displayName}</strong></td>
                    <td class="code-cell">${displayCode || '--'}</td>
                    <td class="admin-col ${isAdmin ? '' : 'hidden'}">${importDisplay}</td>
                    <td>${sellingDisplay}</td>
                    <td class="admin-col ${isAdmin ? '' : 'hidden'}">${profitDisplay}</td>
                    <td>
                        <span class="${item.is_paid ? 'status-paid' : 'status-unpaid'}">
                            ${item.is_paid ? 'Đã TT' : 'Chưa TT'}
                        </span>
                    </td>
                    <td>
                        ${item.image_url ? `<a href="${item.image_url}" target="_blank"><img src="${item.image_url}" class="thumb"></a>` : '--'}
                    </td>
                    <td class="admin-col ${isAdmin ? '' : 'hidden'}">
                        <button class="btn" style="padding:4px 8px; font-size:12px;" onclick='editItem(${JSON.stringify(item)})'>Sửa</button>
                        <button class="btn btn-danger" style="padding:4px 8px; font-size:12px;" onclick="deleteItem(${item.id})">Xóa</button>
                    </td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
    }

    async function handleSave(e) {
        e.preventDefault();
        let editId = document.getElementById('edit-id').value;
        
        let rawCodeInput = document.getElementById('input-codes').value.trim();
        let expandedCodes = expandCodeRanges(rawCodeInput).join(', ');

        let importDateVal = document.getElementById('input-import-date').value || new Date().toISOString().split('T')[0];
        let exportDateVal = document.getElementById('input-export-date').value || importDateVal;

        let payload = {
            item_name: document.getElementById('input-item-name').value.trim(),
            weight_expr: document.getElementById('input-weight').value.trim(),
            code: expandedCodes,
            import_price_raw: String(document.getElementById('input-import-price').value || '').trim(),
            selling_price_raw: String(document.getElementById('input-selling-price').value || '').trim(),
            import_price: calculatePrice(document.getElementById('input-import-price').value),
            selling_price: calculatePrice(document.getElementById('input-selling-price').value),
            import_date: importDateVal,
            export_date: exportDateVal,
            is_paid: document.getElementById('input-is-paid').checked,
            image_url: document.getElementById('input-image-url').value.trim() || null
        };

        if (editId) {
            const { error } = await supabaseClient.from('cattle').update(payload).eq('id', editId);
            if (error) { alert('Lỗi: ' + error.message); return; }
        } else {
            const { error } = await supabaseClient.from('cattle').insert([payload]);
            if (error) { alert('Lỗi: ' + error.message); return; }
        }

        alert('Đã lưu thành công!');
        resetForm();
        loadData(currentFilter);
    }

    function editItem(item) {
        document.getElementById('edit-id').value = item.id;
        
        let cleanName = (item.item_name || '').replace(/\s*\(\d+\s*con\)/gi, '').trim();
        document.getElementById('input-item-name').value = cleanName;
        
        document.getElementById('input-weight').value = item.weight_expr || '';
        document.getElementById('input-codes').value = item.code || '';
        document.getElementById('input-import-price').value = item.import_price_raw || item.import_price || '';
        document.getElementById('input-selling-price').value = item.selling_price_raw || item.selling_price || '';
        document.getElementById('input-import-date').value = item.import_date || '';
        document.getElementById('input-export-date').value = item.export_date || item.import_date || '';
        document.getElementById('input-is-paid').checked = item.is_paid;
        document.getElementById('input-image-url').value = item.image_url || '';

        document.getElementById('form-title').innerText = 'Chỉnh Sửa Hóa Đơn';
        document.getElementById('btn-save').innerText = 'Cập Nhật';
        document.getElementById('btn-cancel').classList.remove('hidden');
    }

    function resetForm() {
        document.getElementById('cattle-form').reset();
        document.getElementById('edit-id').value = '';
        document.getElementById('form-title').innerText = 'Nhập Hóa Đơn Mới';
        document.getElementById('btn-save').innerText = 'Lưu Hóa Đơn';
        document.getElementById('btn-cancel').classList.add('hidden');
        document.getElementById('input-import-date').valueAsDate = new Date();
        document.getElementById('input-export-date').valueAsDate = new Date();
    }

    async function deleteItem(id) {
        if (confirm('Bạn chắc chắn muốn xóa?')) {
            await supabaseClient.from('cattle').delete().eq('id', id);
            loadData(currentFilter);
        }
    }

    loadData();
</script>
</body>
</html>
